server {
    listen 80;

    # Auth (GoTrue)
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST (PostgREST)
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web app Beaver (Flutter web build, served under /beaver/).
    # Must precede `location /`, whose try_files would otherwise swallow it.
    location /beaver/ {
        alias /usr/share/nginx/beaver/;
        index index.html;
        # Flutter web is a SPA: unknown paths return index.html, not 404.
        try_files $uri $uri/ /beaver/index.html;
        # See the Cache-Control note in `location /`.
        add_header Cache-Control "no-cache" always;
    }

    # Web app (Flutter web build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Flutter web files keep their names across builds (the tree-shaken
        # icon font, main.dart.js), so without this a browser may reuse an old
        # copy by heuristic freshness and show a new build with stale icons.
        # no-cache still caches, it just revalidates by ETag (a cheap 304).
        add_header Cache-Control "no-cache" always;
    }
}
