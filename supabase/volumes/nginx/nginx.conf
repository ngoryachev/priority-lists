server {
    listen 80;

    # Auth (GoTrue)
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST (PostgREST)
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web app Beaver (Flutter web build, served under /beaver/).
    # Must precede `location /`, whose try_files would otherwise swallow it.
    location /beaver/ {
        alias /usr/share/nginx/beaver/;
        index index.html;
        # Flutter web is a SPA: unknown paths return index.html, not 404.
        try_files $uri $uri/ /beaver/index.html;
    }

    # Web app (Flutter web build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
